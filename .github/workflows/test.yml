name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Run the R-free test suite
        # The R-parity tests (tests/test_exact_match.py) auto-skip without a
        # reference dump; regenerate one locally with tests/r_reference_driver.R
        # and set NICHEDE_REF_DIR to run the full pre-registered gate.
        run: pytest -q
